---
layout: default
title: "Статті"
permalink: /articles/
description: "Всі статті про село Заріччя над Прутом."
---
{%- assign posts = site.posts | sort: "date" | reverse %}
<div id="main">
	<h1>Статті</h1>
	<div class="catalog">
		<ul>
		{%- for post in posts %}
			<li><a href="{{ post.url }}">{{ post.title }}</a>
				<div class="text">
					{{ post.description }}...
				</div>
			</li>
		{%- endfor %}
		</ul>
	</div>
</div>

<header class="site">
<div class="wrap header-row">
<a class="brand" href="/" title="{{ site.title }}"><span class="brand-logo" role="img" aria-label="{{ site.title }}"></span></a>
<nav>
{%- for item in site.data.menu.top %}
{%- comment -%} The brand already links home. {%- endcomment -%}
{%- if item.url == "/" %}{% continue %}{% endif %}
{%- assign is_current = false %}
{%- if page.url contains item.url %}{% assign is_current = true %}{% endif %}
<a href="{{ item.url }}" title="{{ item.tooltip }}"{% if is_current %} class="current"{% endif %}>{{ item.title }}</a>
{%- endfor %}
</nav>
</div>
</header>

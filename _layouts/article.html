---
layout: default
---
{%- include facebook-sdk.html %}
{%- assign category = site.data.categories | where: "id", page.category_id | first %}
<div id="main">
	<h1>{{ page.title }}</h1>
	<div class="rozdil">
		<div class="item">
			<div class="text">
{{ content }}
			</div>
		</div>
		<h1>Куди далі?</h1>

		<div id="properties">
		<a href="{{ category.url }}">Перейти в розділ "{{ category.name }}"</a><br />
		<a href="/articles/">Перейти в розділ "Статті"</a><br />
		</div>

		<div class="clear"></div>
		<div class="fb-comments" data-href="{{ page.url | absolute_url }}" data-width="auto" data-numposts="5"></div>
		<div id="mc-container"></div>
	</div>
</div>

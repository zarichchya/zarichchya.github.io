---
layout: default
---
{%- include facebook-sdk.html %}
<article class="prose">
	<h1>{{ page.title }}</h1>
	<p class="when"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{% include date-uk.html date=page.date %}</time> · <a href="/articles/">Статті</a></p>
	{%- if page.description %}
	<p class="lede">{{ page.description }}</p>
	{%- endif %}
{{ content }}
</article>

<p class="back"><a href="/articles/">← Усі статті</a></p>

<div class="fb-widget">
	<div class="fb-comments" data-href="{{ page.url | absolute_url }}" data-width="auto" data-numposts="5"></div>
</div>
